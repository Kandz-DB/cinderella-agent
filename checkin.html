<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Check-in — Risk 2 Solution</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px;max-width:500px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.logo{font-size:20px;font-weight:700;color:#4ECDC4;margin-bottom:4px;letter-spacing:-.5px}
.sub{font-size:12px;color:#888;margin-bottom:28px}
h2{font-size:16px;font-weight:600;color:#1a1a1a;margin-bottom:20px}
label{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:5px;margin-top:16px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;background:#fafafa;transition:border .2s;outline:none;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#4ECDC4;background:#fff}
.slider-row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:#4ECDC4}
.cap-val{font-size:18px;font-weight:700;color:#4ECDC4;min-width:44px;text-align:right}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#4ECDC4,#45B7AA);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:24px;font-family:inherit;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.success{display:none;text-align:center;padding:24px 0}
.success .tick{font-size:48px;margin-bottom:12px}
.success h3{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.success p{font-size:13px;color:#888}
.error-msg{background:#FEE;border:1px solid #FCC;border-radius:8px;padding:12px;font-size:13px;color:#A33;margin-top:12px;display:none}
.sending{display:none;text-align:center;padding:12px;font-size:13px;color:#888}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Cinderella</div>
  <div class="sub">Executive Assistant to COO · Risk 2 Solution</div>

  <div id="form-section">
    <h2>Weekly Check-in</h2>

    <label>Your name</label>
    <select id="name">
      <option value="">Select your name...</option>
      <option>Janita Zhang</option>
      <option>Reinette Kruger</option>
      <option>Diane Kruger</option>
      <option>Garima Arora</option>
      <option>Paul Johnston</option>
      <option>Dani Stevenson</option>
      <option>Ross Mackenzie</option>
      <option>Cherry Abadeza</option>
    </select>

    <label>Capacity this week (%)</label>
    <div class="slider-row">
      <input type="range" id="capacity" min="10" max="100" value="80" oninput="document.getElementById('capval').textContent=this.value+'%'">
      <div class="cap-val" id="capval">80%</div>
    </div>

    <label>Projects you're working on this week</label>
    <input type="text" id="projects" placeholder="e.g. Client onboarding, ISO prep, platform review">

    <label>Any blockers or things you need support with?</label>
    <textarea id="blockers" rows="2" placeholder="None, or describe what you need..."></textarea>

    <label>Your main focus for next week</label>
    <input type="text" id="focus" placeholder="e.g. Complete Q2 review, onboard new client">

    <label>Anything else Kandia should know?</label>
    <textarea id="support" rows="2" placeholder="Optional — team updates, personal notes, etc."></textarea>

    <div class="error-msg" id="error-msg"></div>
    <div class="sending" id="sending-msg">Submitting your check-in...</div>
    <button class="btn" id="submit-btn" onclick="submitCheckin()">Submit check-in</button>
  </div>

  <div class="success" id="success-section">
    <div class="tick">✅</div>
    <h3>Check-in received!</h3>
    <p>Thanks <span id="success-name"></span> — Kandia will review your update shortly.</p>
  </div>
</div>

<script>
async function submitCheckin() {
  var name = document.getElementById('name').value;
  if (!name) { showError('Please select your name before submitting.'); return; }

  var btn = document.getElementById('submit-btn');
  var errEl = document.getElementById('error-msg');
  var sendEl = document.getElementById('sending-msg');
  btn.disabled = true;
  errEl.style.display = 'none';
  sendEl.style.display = 'block';

  // Calculate week ending (Sunday)
  var today = new Date();
  var day = today.getDay();
  var sunday = new Date(today);
  sunday.setDate(today.getDate() + (day === 0 ? 0 : 7 - day));
  var weekEnding = sunday.toISOString().split('T')[0];

  var payload = {
    name: name,
    capacity: parseInt(document.getElementById('capacity').value) || 80,
    projects: document.getElementById('projects').value.trim(),
    blockers: document.getElementById('blockers').value.trim() || 'None',
    focus: document.getElementById('focus').value.trim(),
    support: document.getElementById('support').value.trim(),
    weekEnding: weekEnding,
    submitted: new Date().toISOString()
  };

  var attempts = 0;
  var maxAttempts = 3;
  var lastError = '';

  while (attempts < maxAttempts) {
    attempts++;
    try {
      var serverUrl = window.location.origin;
      var r = await fetch(serverUrl + '/checkins/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      var data = await r.json();

      if (r.ok && data.success) {
        // Success
        sendEl.style.display = 'none';
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-name').textContent = name.split(' ')[0];
        document.getElementById('success-section').style.display = 'block';
        return;
      } else {
        lastError = data.error || ('Server error ' + r.status);
        if (r.status === 400) break; // Don't retry validation errors
      }
    } catch(e) {
      lastError = 'Network error — please check your connection. (' + e.message + ')';
    }

    if (attempts < maxAttempts) {
      sendEl.textContent = 'Retrying... (attempt ' + (attempts+1) + ' of ' + maxAttempts + ')';
      await new Promise(function(resolve){ setTimeout(resolve, 2000); });
    }
  }

  // All attempts failed
  sendEl.style.display = 'none';
  btn.disabled = false;
  showError('Could not submit your check-in after ' + maxAttempts + ' attempts. Error: ' + lastError + '\n\nPlease screenshot this message and send it to Kandia.');
}

function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
